name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` input on purpose — action-setup reads the `packageManager`
      # field from package.json, so the pin lives in exactly one place and CI
      # cannot drift from what corepack gives a contributor locally.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: `pnpm test` runs *.test.ts on Node's built-in runner via
          # native TypeScript stripping, which needs 22.18+. On 20 the test step
          # fails outright. Keep in sync with .nvmrc and root package.json engines.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting first: it's the fastest check and the cheapest failure to fix
      # (`pnpm format`), so don't spend a build on a PR that only needs a reformat.
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm -r build
      - run: pnpm run typecheck
      # Tests run last: they're the slowest check, and they import workspace deps
      # through their dist/ output, so they need the build above to have run.
      - run: pnpm run test
